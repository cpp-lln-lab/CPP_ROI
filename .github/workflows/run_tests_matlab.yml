---
name: tests and coverage with matlab

env:
  SPM_VERSION: 26.10.01

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
    - main
  pull_request:
    branches: ['*']
  schedule:
  - cron: 1 1 1 * *

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  tests_matlab:

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        version: [R2021a, R2026b]

    runs-on: ${{matrix.os}}

    steps:
    - name: Install MATLAB
      uses: matlab-actions/setup-matlab@v3.1.0
      with:
        release: ${{matrix.version}}

    - name: Install CPP_ROI
      uses: actions/checkout@v7
      with:
        submodules: true
        fetch-depth: 0

    - name: Install SPM
      shell: bash
      run: |
        curl -fsSL -o spm.zip https://github.com/spm/spm/releases/download/${SPM_VERSION}/spm_${SPM_VERSION}.zip
        unzip -q spm.zip
        rm spm.zip

    - name: Install Moxunit and MOcov
      run: |
        git clone https://github.com/MOxUnit/MOxUnit.git --depth 1
        git clone https://github.com/MOcov/MOcov.git --depth 1

    - name: Add bids-matlab
      run: make install_dev

    - name: Run tests
      uses: matlab-actions/run-command@v3.3.0
      with:
        command: cd(fullfile(getenv('GITHUB_WORKSPACE'), '.github', 'workflows')); run tests_matlab;

    - name: Code coverage
      uses: codecov/codecov-action@v7
      with:
        file: coverage.xml
        flags: ${{ matrix.os }}_matlab-${{ matrix.version }}
        name: codecov-umbrella
        fail_ci_if_error: false
